name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: test -z "$(gofmt -l services/gateway)"
      - run: make test-go

  harmonizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: make test-java

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make test-python

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: make test-web

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: make tf-validate

  # The whole platform on synthetic data, then the release gates: identity resolution must not
  # merge two people, LLM extraction must clear the bar, and every control must have evidence.
  end-to-end:
    runs-on: ubuntu-latest
    needs: [gateway, harmonizer, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: astral-sh/setup-uv@v5
      - run: make pipeline
      - run: make eval
      - run: make evidence
      - run: python3 -c "import json,sys; s=json.load(open('evidence.json'))['summary']; sys.exit(1 if s.get('fail') else 0)"
      - uses: actions/upload-artifact@v4
        with: { name: audit-evidence, path: evidence.json }
