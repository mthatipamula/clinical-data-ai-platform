plugins {
    id 'java'
    id 'application'
}

group = 'com.cdap'
version = '0.1.0'

repositories { mavenCentral() }

ext {
    beamVersion = '2.61.0'
    hapiVersion = '7.4.0'
}

dependencies {
    implementation "org.apache.beam:beam-sdks-java-core:${beamVersion}"
    runtimeOnly "org.apache.beam:beam-runners-direct-java:${beamVersion}"
    // Add -Pdataflow to bundle the Dataflow runner and the GCS filesystem.
    if (project.hasProperty('dataflow')) {
        runtimeOnly "org.apache.beam:beam-runners-google-cloud-dataflow-java:${beamVersion}"
    }
    implementation "ca.uhn.hapi.fhir:hapi-fhir-base:${hapiVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiVersion}"
    runtimeOnly "ca.uhn.hapi.fhir:hapi-fhir-caching-caffeine:${hapiVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.13'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.cdap.harmonizer.HarmonizePipeline'
    applicationDefaultJvmArgs = ['-Dorg.slf4j.simpleLogger.defaultLogLevel=warn']
}

test {
    useJUnitPlatform()
    testLogging { events 'failed' }
}
